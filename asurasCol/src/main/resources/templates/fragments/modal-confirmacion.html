<th:block xmlns:th="http://www.thymeleaf.org">
    <div th:fragment="modalConfirmacion" class="modal fade" id="modalConfirmacion" tabindex="-1"
        aria-labelledby="modalConfirmacionLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header" id="modalConfirmacionHeader">
                    <h5 class="modal-title" id="modalConfirmacionLabel">
                        <i class="fa-solid fa-triangle-exclamation me-2"></i>
                        Confirmar acción
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalConfirmacionBody">
                    ¿Estás seguro de realizar esta acción?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="btnCancelarAccion"
                        data-bs-dismiss="modal">
                        <i class="fa-solid fa-times me-1"></i>Cancelar
                    </button>
                    <button type="button" class="btn btn-danger btn-sm" id="btnConfirmarAccion">
                        <i class="fa-solid fa-check me-1"></i>Confirmar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script th:fragment="modalScripts">
        function mostrarModalConfirmacion(titulo, mensaje, tipo = 'warning', onConfirm, textoBotonConfirmar = 'Confirmar', soloMensaje = false) {
            const header = document.getElementById('modalConfirmacionHeader');
            const label = document.getElementById('modalConfirmacionLabel');

            const iconos = {
                danger: 'fa-solid fa-circle-exclamation',
                warning: 'fa-solid fa-triangle-exclamation',
                info: 'fa-solid fa-circle-info',
                success: 'fa-solid fa-check-circle'
            };
            const colores = {
                danger: 'bg-danger',
                warning: 'bg-warning',
                info: 'bg-info',
                success: 'bg-success'
            };
            // Qué color de texto corresponde al fondo
            const textoHeader = {
                danger: 'text-white',
                warning: 'text-dark',
                info: 'text-dark',    // ← cyan + blanco no contrasta; usamos dark
                success: 'text-white'
            };

            header.className = `modal-header ${colores[tipo] || 'bg-warning'} ${textoHeader[tipo] || 'text-dark'}`;

            // Forzamos el color del título por si el tema lo sobreescribe
            label.className = 'modal-title ' + (textoHeader[tipo] || 'text-dark');

            label.innerHTML = `
            <i class="${iconos[tipo] || 'fa-solid fa-triangle-exclamation'} me-2"></i>
            ${titulo}
        `;

            document.getElementById('modalConfirmacionBody').innerHTML = mensaje;

            const btnCancelar = document.getElementById('btnCancelarAccion');
            btnCancelar.style.display = soloMensaje ? 'none' : '';

            const btnConfirmar = document.getElementById('btnConfirmarAccion');
            btnConfirmar.textContent = textoBotonConfirmar;

            const clasesBtn = {
                danger: 'btn-danger',
                warning: 'btn-warning',
                info: 'btn-info',
                success: 'btn-success'
            };
            btnConfirmar.className = `btn ${clasesBtn[tipo] || 'btn-danger'} btn-sm`;

            const nuevoBtn = btnConfirmar.cloneNode(true);
            btnConfirmar.parentNode.replaceChild(nuevoBtn, btnConfirmar);

            nuevoBtn.addEventListener('click', function () {
                const modal = bootstrap.Modal.getInstance(document.getElementById('modalConfirmacion'));
                modal.hide();
                if (typeof onConfirm === 'function') {
                    onConfirm();
                }
            });

            const modal = new bootstrap.Modal(document.getElementById('modalConfirmacion'));
            modal.show();
        }

        function mostrarMensajeSistema(titulo, mensaje, tipo = 'info') {
            mostrarModalConfirmacion(titulo, mensaje, tipo, null, 'Entendido', true);
        }
    </script>
</th:block>
